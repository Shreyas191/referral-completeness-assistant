name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pydantic rapidfuzz rank-bm25 python-dotenv pdfplumber pytest ruff
      - run: ruff check src tests datagen
      - run: pytest -q
